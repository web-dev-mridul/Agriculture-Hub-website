    <!-- contact us form start -->
    <section>
      <div class="container">
        <!-- title -->
        <div class="text-center my-5">
          <h2><span class="line">Crop Details</span></h2>
        </div>
        <div class="row">
          <form onsubmit="formsubmit()">
            <div class="mb-3">
              <label for="exampleInputName" class="form-label">Your Name</label>
              <input
                type="text"
                class="form-control"
                id="exampleInputName"
                aria-describedby="emailHelp"
              />
            </div>
            <div class="mb-3">
              <label for="exampleInputEmail" class="form-label"
                >Your Email</label
              >
              <input type="email" class="form-control" id="exampleInputEmail" />
            </div>
            <div class="mb-3">
              <label for="exampleInputOption" class="form-label"
                >Select Your Topic</label
              >
              <select
                class="form-select"
                aria-label="Default select example"
                id="exampleInputOption"
              >
                <option>Choose an option</option>
                <option>Crop Farming</option>
                <option>Pest Control</option>
                <option>Soil Management</option>
                <option>Irrigation</option>
                <option>Fertilizers</option>
                <option>Harvesting</option>
              </select>
            </div>
            <div class="mb-3">
              <label for="exampleInputMessage" class="form-label"
                >Leave a Message</label
              >
              <textarea
                class="form-control"
                id="exampleInputMessage"
              ></textarea>
            </div>
            <div class="mb-3">
              <label for="exampleInputFile" class="form-label"
                >Attach a file</label
              >
              <input type="file" class="form-control" id="exampleInputFile" />
            </div>
            <div class="mb-3">
              <button class="button-size">Submit</button>
            </div>
          </form>
        </div>
      </div>
    </section>
    <!-- contact us form end -->
    <!-- direct contact start -->

          <div class="col-sm-12 col-sm-12 col-lg-6">
            <p><i class="ri-map-pin-line icon-size"></i>Dhaka, Bangladesh</p>
            <p><i class="ri-phone-line icon-size"></i>+880 1234-567890</p>
            <p>
              <i class="ri-mail-send-line icon-size"></i
              >support@agriculturehub.com

            <p>

              <a href="https://www.facebook.com/" target="_blank"><i class="ri-facebook-box-fill"></i> </a>

              <a href="https://www.youtube.com/" target="_blank"><i class="ri-youtube-fill"></i></a>
            </p>
